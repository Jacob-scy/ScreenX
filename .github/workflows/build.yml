name: Build/release

# 仅手动触发：本项目实际发布路径为 pnpm release（build:release + publish:r2
# + deploy:site），不依赖 GitHub Actions 的 prerelease；6 平台矩阵构建成本高，
# 不再随 push/tag 自动触发，避免浪费 CI 额度
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        arch: [x64, arm64]
      max-parallel: 3

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v1

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Linux Lib
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install libx11-dev libxext-dev libxtst-dev libxrender-dev libxmu-dev libxmuu-dev rpm

      - name: ${{ matrix.os }} ${{ matrix.arch }} build
        env:
          M_ARCH: ${{matrix.arch}}
          USE_HARD_LINKS: false
        run: |
          npm install -g pnpm@10.17.0
          pnpm install
          pnpm run dist

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: "build/*"
          draft: false
          prerelease: true
          generate_release_notes: true
        # 不再引用仓库未配置的 Access Token secret：softprops/action-gh-release
        # 默认使用仓库自动提供的 ${{ github.token }}
